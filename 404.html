<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost in the Universe | SMASH</title>
<meta name="description" content="Diese Seite ist nicht im Universe. Zurück zum Hub.">
<meta name="theme-color" content="#00ff6a">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #050505;
    --bg2: #0c0c0c;
    --surface: #0f0f0f;
    --border: #1a1a1a;
    --text: #fff;
    --text2: #888;
    --text3: #555;
    --green1: #00ff6a;
    --green2: #00cc55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at top, rgba(0,255,106,.10) 0%, transparent 60%);
  }
  .page-404 {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: clamp(24px, 4vw, 56px) clamp(18px, 3vw, 32px);
    z-index: 1;
  }
  .eyebrow-404 {
    font-size: clamp(10px, 1vw, 12px);
    font-weight: 800;
    letter-spacing: clamp(4px, 0.6vw, 6px);
    color: var(--green1);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .num-404 {
    font-size: clamp(80px, 14vw, 160px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: clamp(-5px, -0.5vw, -2px);
    background: linear-gradient(135deg, var(--green1), var(--green2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .text-404 {
    font-size: clamp(18px, 2.3vw, 28px);
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.4px;
  }
  .sub-404 {
    font-size: clamp(13px, 1.3vw, 16px);
    color: var(--text2);
    margin-bottom: 32px;
    max-width: 420px;
    line-height: 1.6;
  }
  .back-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: clamp(12px, 1.4vw, 16px) clamp(20px, 2.4vw, 28px);
    background: linear-gradient(135deg, var(--green1), var(--green2));
    color: var(--bg);
    border-radius: 100px;
    font-weight: 800;
    font-size: clamp(12px, 1.2vw, 14px);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 4px 28px rgba(0,255,106,0.3);
    transition: transform 0.15s, box-shadow 0.25s;
  }
  .back-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 36px rgba(0,255,106,0.45); }
  .footnote-404 {
    margin-top: 40px;
    font-size: 10.5px;
    color: var(--text3);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="page-404">
  <div class="eyebrow-404">404 · Lost in the Universe</div>
  <div class="num-404">404</div>
  <div class="text-404">Diese Seite ist nicht im Universe.</div>
  <div class="sub-404">Vielleicht noch nicht gebaut. Vielleicht in einer anderen Phase. Zurück zum Hub — von da führen alle Pfade weiter.</div>
  <a href="/" class="back-cta">← Zum Hub</a>
  <div class="footnote-404">smashuniverse.info · Mehrere Apps. Ein Universe.</div>
</div>
</body>
</html>
